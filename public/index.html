<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== AUTH ===== -->
<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <h1>💬 Мессенджер</h1>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Вход</button>
      <button id="tabReg" class="tab">Регистрация</button>
    </div>
    <div id="regNameWrap" style="display:none">
      <input id="regName" placeholder="Ваше имя">
    </div>
    <input id="phone" placeholder="+79001234567" inputmode="tel">
    <input id="password" type="password" placeholder="Пароль (мин. 6 символов)">
    <button id="authBtn" class="btn-primary">Войти</button>
    <div id="authErr" class="err"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="me">
      <div class="me-left">
        <div class="avatar" id="meAvatar">
          <span id="meAvatarLetter"></span>
          <div class="avatar-overlay">📷</div>
        </div>
        <div class="me-info"><b id="meName"></b><span id="mePhone"></span></div>
      </div>
      <button id="logoutBtn" title="Выйти">⏻</button>
    </div>
    <input type="file" id="avatarInput" accept="image/*" hidden>
    <div class="side-actions">
      <button id="newGroupBtn" class="btn-small">＋ Группа</button>
      <button id="newChatBtn" class="btn-small">＋ Личный чат</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="chat">
    <div id="chatHeader" class="chat-header"><span class="muted">Выберите чат</span></div>
    <div id="messages" class="messages"></div>
    <div id="typing" class="typing"></div>
    <div class="composer">
      <input type="file" id="fileInput" accept="image/*,video/*" hidden>
      <button id="attachBtn" title="Фото / видео (без сжатия)">📎</button>
      <button id="voiceBtn" title="Голосовое сообщение">🎤</button>
      <input id="msgInput" placeholder="Сообщение…" autocomplete="off">
      <button id="sendBtn" class="btn-primary">➤</button>
    </div>
  </main>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <input id="groupName" placeholder="Название группы" style="display:none">
    <div id="userPicker" class="user-picker"></div>
    <div class="modal-btns">
      <button id="modalCancel">Отмена</button>
      <button id="modalOk" class="btn-primary">Создать</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
